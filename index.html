<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Practice Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a five-week course map laid out like a measure of music, one bar per week, with Tempo the metronome as the guide. */
:root {
  --ink: #1b2340;
  --ink-soft: #4b5372;
  --paper: #f3f4f8;
  --card: #ffffff;
  --line: #d9dce8;
  --wood: #c98a1f;
  --wood-soft: #f6e7c8;
  --coral: #d9573d;
  --open: #2f7d5b;
  --open-soft: #dcefe5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8eaf4; --ink-soft: #a9afc8; --paper: #121629; --card: #1c2240;
    --line: #2f375c; --wood: #e3a947; --wood-soft: #3a3020; --coral: #f07a5f;
    --open: #6fcf9f; --open-soft: #173a2b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8eaf4; --ink-soft: #a9afc8; --paper: #121629; --card: #1c2240;
  --line: #2f375c; --wood: #e3a947; --wood-soft: #3a3020; --coral: #f07a5f;
  --open: #6fcf9f; --open-soft: #173a2b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.55 var(--body); }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 20px; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--wood); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

/* Top bar */
.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 20px; }
.brand img { width: 34px; }
.codechip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
.codechip strong { font-family: var(--display); letter-spacing: 0.08em; color: var(--ink); font-size: 17px; }

button, .btn {
  font: 700 16px/1 var(--body); border-radius: 10px; padding: 12px 18px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--ink); color: var(--paper); text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn.ghost, button.ghost { background: transparent; color: var(--ink); }
button.link { border: 0; background: none; color: var(--ink-soft); padding: 4px; text-decoration: underline; font-weight: 400; font-size: 15px; }

/* Home hero */
.hero { display: grid; grid-template-columns: 1fr 200px; gap: 28px; align-items: center; padding: 36px 0 20px; }
.hero p.lead { margin-top: 14px; font-size: 19px; color: var(--ink-soft); max-width: 60ch; }
.hero img { width: 190px; justify-self: end; }

/* Code card */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.idcard { display: grid; gap: 16px; border-left: 6px solid var(--wood); }
.idcard .why { color: var(--ink-soft); max-width: 62ch; }
.idfields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.field label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.field .hint { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; min-height: 2.6em; }
.field input {
  width: 100%; font: 700 22px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase;
  padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
}
.field input:focus { border-color: var(--wood); outline: none; }
.idrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.preview { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: 0.14em; }
.err { color: var(--coral); font-weight: 700; font-size: 15px; }
.saved { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* Course map */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 38px 0 14px; flex-wrap: wrap; }
.section-head p { color: var(--ink-soft); }
.map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 2px solid var(--ink); border-radius: 16px; background: var(--card); overflow: hidden; }
.bar {
  position: relative; padding: 16px 14px 18px; display: grid; gap: 8px; align-content: start;
  text-decoration: none; border-right: 2px solid var(--ink); min-height: 300px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 21px, var(--line) 21px 22px);
  background-size: 100% 110px; background-repeat: no-repeat; background-position: 0 44px;
}
.bar:last-child { border-right: 0; }
.bar:hover { background-color: var(--wood-soft); }
.bar .mnum { font: 700 13px/1 var(--body); color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }
.bar img { height: 118px; width: auto; margin: 4px auto 6px; }
.bar h3 { font-size: 21px; }
.bar .what { font-size: 14.5px; color: var(--ink-soft); }
.pill { justify-self: start; font: 700 13px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: var(--line); color: var(--ink); }
.pill.open { background: var(--open-soft); color: var(--open); }
.pill.soon { background: var(--wood-soft); color: var(--ink); }

.bookends { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.bookend { display: flex; gap: 14px; align-items: center; text-decoration: none; }
.bookend .tag { font: 800 14px/1 var(--display); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 10px; min-width: 64px; text-align: center; }
.bookend p { color: var(--ink-soft); font-size: 15px; }

/* Why these five (home) */
.why5 { margin-bottom: 16px; border-left: 6px solid var(--coral); padding: 0; overflow: hidden; }
.why5 summary { list-style: none; cursor: pointer; padding: 14px 22px; display: flex; align-items: center; gap: 16px; }
.why5 summary::-webkit-details-marker { display: none; }
.why5 summary img { height: 64px; width: auto; flex: none; }
.why5 summary .ttl { flex: 1; }
.why5 summary h2 { font-size: 24px; }
.why5 summary .chev { font: 800 22px/1 var(--display); color: var(--coral); transition: transform .2s ease; }
.why5[open] summary .chev { transform: rotate(45deg); }
.why5 .body { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: center; padding: 20px 22px 22px; border-top: 1px solid var(--line); }
.why5 .eyebrow { font-weight: 700; color: var(--coral); letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; display: block; margin-bottom: 4px; }
.why5 p.copy { color: var(--ink-soft); margin-top: 8px; max-width: 58ch; }
.why5 p.copy strong { color: var(--ink); }
.why5 button.link { margin-top: 8px; padding: 4px 0; }
.stats { display: grid; gap: 10px; }
.stat { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; background: var(--paper); border-radius: 12px; padding: 10px 14px; }
.stat b { font: 800 30px/1 var(--display); color: var(--ink); }
.stat span { font-size: 15px; color: var(--ink-soft); line-height: 1.35; }

/* About the research (home) */
.research { margin-top: 38px; padding: 0; overflow: hidden; }
.research summary { list-style: none; cursor: pointer; padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.research summary::-webkit-details-marker { display: none; }
.research summary h2 { font-size: 24px; }
.research summary .sub { display: block; font-family: var(--body); font-size: 15px; font-weight: 400; color: var(--ink-soft); margin-top: 4px; }
.research summary .chev { font: 800 22px/1 var(--display); color: var(--wood); transition: transform .2s ease; }
.research[open] summary .chev { transform: rotate(45deg); }
.research .body { padding: 0 22px 24px; display: grid; gap: 18px; border-top: 1px solid var(--line); padding-top: 20px; }
.research h3 { font-size: 19px; margin-bottom: 6px; }
.research p { color: var(--ink-soft); max-width: 70ch; }
.research p strong { color: var(--ink); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.taught { display: grid; gap: 8px; margin-top: 4px; }
.taught .row { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; font-size: 15px; }
.taught .track { height: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.taught .fill { height: 100%; background: var(--wood); border-radius: 999px; }
.taught .row.low .fill { background: var(--coral); }
.taught .pct { font-weight: 700; text-align: right; }
.quote { border-left: 4px solid var(--wood); padding: 6px 0 6px 16px; font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.quote span { display: block; font-family: var(--body); font-size: 14.5px; font-weight: 400; color: var(--ink-soft); margin-top: 6px; }
.cite { font-size: 14px; color: var(--ink-soft); }

/* Survey launch + return */
.launch { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding: 8px 4px; }
.launch strong { display: block; font-family: var(--display); font-size: 22px; margin-bottom: 6px; }
.launch p { color: var(--ink-soft); max-width: 60ch; }
.btn.big { font-size: 18px; padding: 16px 26px; border-radius: 12px; }
.pill.done { background: var(--ink); color: var(--paper); }
.thanks { display: flex; align-items: center; gap: 16px; margin-top: 22px; padding: 14px 20px; background: var(--open-soft); border: 1px solid var(--open); border-radius: 16px; }
.thanks img { width: 54px; }
.thanks strong { display: block; color: var(--ink); }
.thanks p { color: var(--ink-soft); font-size: 15.5px; }

/* Module page */
.back { display: inline-block; margin: 22px 0 6px; color: var(--ink-soft); font-size: 15px; }
.mhead { display: grid; grid-template-columns: 150px 1fr; gap: 26px; align-items: center; padding: 10px 0 24px; }
.mhead img { width: 140px; }
.mhead .eyebrow { font-weight: 700; color: var(--wood); letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; }
.mhead p.def { margin-top: 10px; font-size: 19px; color: var(--ink-soft); max-width: 60ch; }
.facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.facts span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; counter-reset: s; margin-bottom: 22px; }
.step { padding: 14px 16px; border-top: 4px solid var(--line); counter-increment: s; }
.step:first-child { border-top-color: var(--wood); }
.step::before { content: counter(s); font: 800 28px/1 var(--display); color: var(--wood); display: block; margin-bottom: 6px; }
.step strong { display: block; }
.step span { color: var(--ink-soft); font-size: 15px; }

.survey { display: grid; gap: 14px; }
.survey-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.survey-bar p { color: var(--ink-soft); font-size: 15px; max-width: 62ch; }
.frame { width: 100%; height: 900px; border: 0; border-radius: 12px; background: var(--card); }
.placeholder {
  min-height: 260px; display: grid; place-items: center; text-align: center; gap: 10px; padding: 30px;
  border: 2px dashed var(--line); border-radius: 12px; color: var(--ink-soft);
}
.placeholder strong { color: var(--ink); font-size: 18px; }

footer { margin: 56px 0 0; padding: 22px 0 36px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 14.5px; }
footer .wrap { display: grid; gap: 6px; }

@media (max-width: 860px) {
  .map { grid-template-columns: 1fr; }
  .bar { border-right: 0; border-bottom: 2px solid var(--ink); min-height: 0; grid-template-columns: 90px 1fr; column-gap: 14px; background-image: none; }
  .bar:last-child { border-bottom: 0; }
  .bar img { grid-row: 1 / span 4; height: 90px; margin: 0; }
  .steps { grid-template-columns: 1fr 1fr; }
  .why5 .body, .cols { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  .hero { grid-template-columns: 1fr; }
  .hero img { justify-self: start; width: 130px; order: -1; }
  .idfields { grid-template-columns: 1fr; }
  .field .hint { min-height: 0; }
  .bookends { grid-template-columns: 1fr; }
  .taught .row { grid-template-columns: 92px 1fr 42px; }
  .mhead { grid-template-columns: 1fr; }
  .mhead img { width: 110px; }
  .steps { grid-template-columns: 1fr; }
  .frame { height: 780px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar img { transition: transform .25s ease; }
  .bar:hover img { transform: rotate(-4deg) translateY(-3px); }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home"><img src="img/tempo.png" alt="">The Practice Room</a>
    <div class="codechip" id="codechip"></div>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    <p>The Practice Room is part of a research study on classroom management in music teacher education at Ball State University.</p>
    <p>Principal Investigator: Hyeonho Henry Yu, Ph.D., Teachers College. All characters and classroom scenes are fictional.</p>
  </div>
</footer>

<script>
/* ============================================================
   SETTINGS: edit this block only.
   url:   the survey's Anonymous Link from Qualtrics (leave "" until ready)
   opens: the date the module opens, as "YYYY-MM-DD" (leave "" to keep it open)
   ============================================================ */
const SETTINGS = {
  preview: true,            // true = every module is open, for testing. Set false when the study starts.
  pre:  { url: "", opens: "" },
  post: { url: "", opens: "" },
  modules: [
    { id: "routines",    week: 1, name: "Routines",    prefix: "RT", img: "dot",   url: "https://bsu.qualtrics.com/jfe/form/SV_24UlND0W5pqbQTs", opens: "",
      what: "Entering, getting instruments, and moving between activities.",
      def: "Teach clear procedures for entering the room, handling instruments, and moving between activities, so students know what to do without being told each time." },
    { id: "rules",       week: 2, name: "Rules",       prefix: "RL", img: "clef",  url: "", opens: "",
      what: "A few clear expectations, taught and connected to instruments.",
      def: "Set a small number of clear expectations, teach them directly, and connect them to how instruments, voices, and space are used." },
    { id: "praise",      week: 3, name: "Praise",      prefix: "PR", img: "hush",  url: "", opens: "",
      what: "Naming the behavior you want to see more of.",
      def: "Notice students who are doing what was asked and name the specific behavior, so the whole class hears what success looks like." },
    { id: "misbehavior", week: 4, name: "Misbehavior", prefix: "MB", img: "bo",    url: "", opens: "",
      what: "Calm, quick, consistent responses that fit the moment.",
      def: "Respond to off-task behavior calmly, quickly, and consistently, with consequences that fit the behavior and keep the music going." },
    { id: "engagement",  week: 5, name: "Engagement",  prefix: "EN", img: "quinn", url: "", opens: "",
      what: "Keeping hands, voices, and minds busy with music.",
      def: "Plan active, well-paced music making so hands, voices, and minds stay busy and there is little room for off-task behavior." }
  ]
};
/* ============================================================ */

const KEY = "practiceRoomPID";
let memoryPID = "";
function getPID() { try { return localStorage.getItem(KEY) || memoryPID; } catch (e) { return memoryPID; } }
function setPID(v) { memoryPID = v; try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }

/* Finished surveys: Qualtrics sends students back with ?done=<id> */
const DONEKEY = "practiceRoomDone";
let memoryDone = [];
function getDone() { try { return JSON.parse(localStorage.getItem(DONEKEY) || "[]"); } catch (e) { return memoryDone; } }
function markDone(id) { const d = getDone(); if (!d.includes(id)) d.push(id); memoryDone = d; try { localStorage.setItem(DONEKEY, JSON.stringify(d)); } catch (e) {} }
function isDone(id) { return getDone().includes(id); }
let justFinished = "";
(function readReturn() {
  const q = new URLSearchParams(location.search);
  const id = q.get("done");
  if (!id) return;
  const valid = id === "pre" || id === "post" || SETTINGS.modules.some(m => m.id === id);
  if (valid) { markDone(id); justFinished = id; }
  try { history.replaceState(null, "", location.pathname + "#home"); } catch (e) {}
})();

function withPID(url) {
  const pid = getPID();
  if (!url || !pid) return url;
  return url + (url.includes("?") ? "&" : "?") + "PID=" + encodeURIComponent(pid);
}
function fmtDate(s) {
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function status(item) {
  if (SETTINGS.preview || !item.opens) return { open: true, label: "Open" };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const opens = new Date(item.opens + "T00:00:00");
  return today >= opens ? { open: true, label: "Open" } : { open: false, label: "Opens " + fmtDate(item.opens) };
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Code chip in the top bar ---------- */
function renderChip() {
  const el = document.getElementById("codechip");
  const pid = getPID();
  el.innerHTML = pid
    ? `Your code <strong>${esc(pid)}</strong> <button class="link" id="chipchange" type="button">Change</button>`
    : `<a href="#home">Make your study code</a>`;
  const b = document.getElementById("chipchange");
  if (b) b.addEventListener("click", () => { location.hash = "home"; setTimeout(() => showForm(true), 0); });
}

/* ---------- Study code form ---------- */
function idCardHTML(editing) {
  const pid = getPID();
  if (pid && !editing) {
    return `<section class="panel idcard" aria-labelledby="idtitle">
      <h2 id="idtitle">Your study code</h2>
      <div class="saved"><span class="preview">${esc(pid)}</span>
        <p class="why">This browser remembers it and adds it to every survey, so your answers connect across the five weeks without your name. On a new device, make the same code again.</p>
        <button class="ghost" type="button" id="editcode">Change code</button></div>
    </section>`;
  }
  return `<section class="panel idcard" aria-labelledby="idtitle">
    <h2 id="idtitle">Make your study code</h2>
    <p class="why">Your code connects your answers across all seven surveys without your name. Use the same three facts every time, on any device.</p>
    <form id="idform" novalidate>
      <div class="idfields">
        <div class="field"><label for="p1">Parent's name</label><span class="hint">First two letters of your mother's (or another parent or guardian's) first name. Maria = MA</span><input id="p1" maxlength="2" autocomplete="off" inputmode="text"></div>
        <div class="field"><label for="p2">Birth day</label><span class="hint">Two-digit day of the month you were born. The 7th = 07</span><input id="p2" maxlength="2" autocomplete="off" inputmode="numeric"></div>
        <div class="field"><label for="p3">Childhood street</label><span class="hint">First two letters of the street you lived on in elementary school. Elm Street = EL</span><input id="p3" maxlength="2" autocomplete="off" inputmode="text"></div>
      </div>
      <div class="idrow" style="margin-top:16px">
        <span class="preview" id="pv" aria-live="polite">______</span>
        <button type="submit">Save my code</button>
        ${pid ? `<button class="link" type="button" id="canceledit">Keep ${esc(pid)}</button>` : ""}
        <span class="err" id="iderr" role="alert"></span>
      </div>
    </form>
  </section>`;
}
function bindForm() {
  const f = document.getElementById("idform");
  const e = document.getElementById("editcode");
  if (e) e.addEventListener("click", () => showForm(true));
  if (!f) return;
  const c = document.getElementById("canceledit");
  if (c) c.addEventListener("click", () => showForm(false));
  const ins = ["p1", "p2", "p3"].map(id => document.getElementById(id));
  const pv = document.getElementById("pv");
  const update = () => { pv.textContent = ins.map(i => (i.value.toUpperCase() + "__").slice(0, 2)).join(""); };
  ins.forEach(i => i.addEventListener("input", update));
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const [a, b, c2] = ins.map(i => i.value.trim().toUpperCase());
    const err = document.getElementById("iderr");
    if (!/^[A-Z]{2}$/.test(a)) { err.textContent = "Parent's name needs two letters."; ins[0].focus(); return; }
    if (!/^(0[1-9]|[12][0-9]|3[01])$/.test(b)) { err.textContent = "Birth day needs two digits, 01 to 31."; ins[1].focus(); return; }
    if (!/^[A-Z]{2}$/.test(c2)) { err.textContent = "Childhood street needs two letters."; ins[2].focus(); return; }
    setPID(a + b + c2); renderChip(); showForm(false);
  });
}
function showForm(editing) {
  const slot = document.getElementById("idslot");
  if (!slot) return;
  slot.innerHTML = idCardHTML(editing); bindForm();
  if (editing) { const first = document.getElementById("p1"); if (first) first.focus(); }
}

/* ---------- Views ---------- */
function home() {
  const bars = SETTINGS.modules.map(m => {
    const s = status(m);
    const pill = isDone(m.id) ? `<span class="pill done">Done</span>` : `<span class="pill ${s.open ? "open" : "soon"}">${s.label}</span>`;
    return `<a class="bar" href="#${m.id}">
      <span class="mnum">Week ${m.week}</span>
      <img src="img/${m.img}.png" alt="">
      <h3>${m.name}</h3>
      <span class="what">${m.what}</span>
      ${pill}
    </a>`;
  }).join("");
  let banner = "";
  if (justFinished) {
    const name = justFinished === "pre" ? "the Before week 1 survey" : justFinished === "post" ? "the After week 5 survey" : "Week " + SETTINGS.modules.find(m => m.id === justFinished).week + ": " + SETTINGS.modules.find(m => m.id === justFinished).name;
    const nextLine = justFinished === "post" ? "That was the last step. Thank you for taking part in the study." : "Nice work. Your answers are saved. Come back for the next module when it opens.";
    banner = `<div class="thanks" role="status"><img src="img/tempo.png" alt=""><div><strong>You finished ${esc(name)}.</strong><p>${nextLine}</p></div></div>`;
    justFinished = "";
  }
  return `${banner}
    <section class="hero">
      <div>
        <h1>Five ways to run a music classroom.</h1>
        <p class="lead">Each week you will watch short scenes from an elementary music class, decide what you would do as the teacher, and compare your plan with feedback from music educators. Then you set one goal for your own teaching.</p>
      </div>
      <img src="img/tempo.png" alt="Tempo, a smiling wooden metronome, waving hello">
    </section>
    <details class="panel why5">
      <summary>
        <img src="img/ollie.png" alt="">
        <div class="ttl"><span class="eyebrow">Why these five?</span><h2>The Big Five of classroom management</h2></div>
        <span class="chev" aria-hidden="true">+</span>
      </summary>
      <div class="body">
      <div>
        <p class="copy" style="margin-top:0"><strong>Rules, Routines, Praise, Misbehavior, and Engagement</strong> are the five strategies with the strongest research support for preventing and handling behavior problems, drawn from more than 150 studies across six decades. Most new teachers are never taught all five. This is where you practice them.</p>
        <button class="link" type="button" id="readresearch">Read about the research</button>
      </div>
      <div class="stats">
        <div class="stat"><b>150+</b><span>studies over six decades point to the same five strategies</span></div>
        <div class="stat"><b>21%</b><span>of teacher prep programs teach all five</span></div>
        <div class="stat"><b>26%</b><span>teach Praise, one of the best-supported strategies</span></div>
      </div>
      </div>
    </details>
    <div id="idslot">${idCardHTML(false)}</div>
    <div class="section-head"><h2>Your five modules</h2><p>One module per week, about 5 scenes each.</p></div>
    <nav class="map" aria-label="Modules by week">${bars}</nav>
    <div class="bookends">
      <a class="panel bookend" href="#pre"><span class="tag">${isDone("pre") ? "Done" : "Start"}</span><div><h3>Before week 1</h3><p>A short survey about where you are now.</p></div></a>
      <a class="panel bookend" href="#post"><span class="tag">${isDone("post") ? "Done" : "Finish"}</span><div><h3>After week 5</h3><p>The same survey again, to see what changed.</p></div></a>
    </div>
    <details class="panel research" id="research">
      <summary>
        <div><h2>About the research</h2><span class="sub">Why classroom management training matters, and where the Big Five come from.</span></div>
        <span class="chev" aria-hidden="true">+</span>
      </summary>
      <div class="body">
        <div class="cols">
          <div>
            <h3>Where the Big Five come from</h3>
            <p>The National Council on Teacher Quality reviewed three major research summaries covering more than 150 studies from PK-12 classrooms (Simonsen et al., 2008; Oliver, Wehby, &amp; Reschly, 2011; Institute of Education Sciences, 2008). Across them, five strategies kept showing strong evidence of effectiveness. NCTQ named them the <strong>Big Five</strong> and recommended that every teacher candidate learn and practice them.</p>
          </div>
          <div>
            <h3>Why training matters</h3>
            <p>Classroom management is one of the hardest parts of the first years of teaching, yet it is unevenly taught. In NCTQ's review of 105 programs, only <strong>32%</strong> addressed at least four of the Big Five and only <strong>21%</strong> addressed all five. Programs that taught more of the Big Five were also far more likely to give candidates a chance to practice them (52% compared with 20%).</p>
          </div>
        </div>
        <div>
          <h3>How often each strategy is taught</h3>
          <p>Share of teacher prep programs that address each strategy in foundational coursework (N = 105).</p>
          <div class="taught" role="list">
            <div class="row" role="listitem"><span>Routines</span><div class="track"><div class="fill" style="width:76%"></div></div><span class="pct">76%</span></div>
            <div class="row" role="listitem"><span>Rules</span><div class="track"><div class="fill" style="width:71%"></div></div><span class="pct">71%</span></div>
            <div class="row" role="listitem"><span>Misbehavior</span><div class="track"><div class="fill" style="width:62%"></div></div><span class="pct">62%</span></div>
            <div class="row low" role="listitem"><span>Engagement</span><div class="track"><div class="fill" style="width:49%"></div></div><span class="pct">49%</span></div>
            <div class="row low" role="listitem"><span>Praise</span><div class="track"><div class="fill" style="width:26%"></div></div><span class="pct">26%</span></div>
          </div>
        </div>
        <div>
          <h3>Why a practice room</h3>
          <p>Knowing a strategy is not the same as using it in the moment. Music classrooms add their own challenges: instruments, movement, sound, and large groups. The Practice Room gives you short, realistic scenes where you decide what to do, compare your plan with feedback from music educators, and set a goal for your own teaching, one strategy per week.</p>
        </div>
        <p class="quote">"Your best lesson plan of the year won't go well if you don't have good classroom management."<span>Third-year teacher, NCTQ survey respondent</span></p>
        <p class="cite">Source: Greenberg, J., Putman, H., &amp; Walsh, K. (2014). <em>Training our future teachers: Classroom management.</em> National Council on Teacher Quality.</p>
      </div>
    </details>`;
}

function surveyBlock(url, label, open, opensLabel, id) {
  const pid = getPID();
  if (!pid) {
    return `<div class="placeholder"><div><strong>Make your study code first.</strong><p>The survey needs your code so your answers connect across weeks.</p></div><a class="btn" href="#home">Make my code</a></div>`;
  }
  if (!open) {
    return `<div class="placeholder"><div><strong>This module ${esc(opensLabel.toLowerCase())}.</strong><p>Come back then. Your code is saved.</p></div></div>`;
  }
  if (!url) {
    return `<div class="placeholder"><div><strong>The ${esc(label)} survey will appear here.</strong><p>Its Qualtrics link has not been added yet.</p></div></div>`;
  }
  const full = withPID(url);
  const done = isDone(id);
  return `<div class="launch">
      <div>
        <strong>${done ? "You finished this survey." : "Ready when you are."}</strong>
        <p>${done
          ? "You can open it again if you need to. When you finish, you will come back to The Practice Room home page."
          : "The survey opens in this window. Your study code goes with it, and when you finish you will come back to The Practice Room home page automatically. If you stop partway, click Start again later to pick up where you left off."}</p>
      </div>
      <a class="btn big" href="${esc(full)}">${done ? "Open the survey again" : "Start the survey"}</a>
    </div>`;
}

function moduleView(m) {
  const s = status(m);
  return `
    <a class="back" href="#home">All modules</a>
    <section class="mhead">
      <img src="img/${m.img}.png" alt="">
      <div>
        <span class="eyebrow">Week ${m.week} of 5</span>
        <h1>${m.name}</h1>
        <p class="def">${m.def}</p>
        <div class="facts"><span>About 5 scenes</span><span>About 40 to 60 minutes</span><span>You can stop and come back</span></div>
      </div>
    </section>
    <div class="steps" aria-label="What you do in each scene">
      <div class="step"><strong>Watch the scene</strong><span>About one minute. Replay it as often as you like.</span></div>
      <div class="step"><strong>Write your response</strong><span>What you notice, what you would do now, and how to prevent it.</span></div>
      <div class="step"><strong>Compare with music educators</strong><span>Read their feedback next to your own answers.</span></div>
      <div class="step"><strong>Set one goal</strong><span>A specific step for your next teaching experience.</span></div>
    </div>
    <section class="panel survey" aria-label="${m.name} survey">${surveyBlock(m.url, m.name, s.open, s.label, m.id)}</section>`;
}

function bookendView(which) {
  const item = SETTINGS[which];
  const s = status(item);
  const title = which === "pre" ? "Before week 1" : "After week 5";
  const text = which === "pre"
    ? "This survey asks about your classroom management knowledge and confidence before the modules begin. It takes about 15 minutes."
    : "This is the same survey you took before week 1. Your answers show how your thinking changed across the five modules.";
  return `
    <a class="back" href="#home">All modules</a>
    <section class="mhead">
      <img src="img/tempo.png" alt="">
      <div><span class="eyebrow">${which === "pre" ? "Start here" : "Last step"}</span><h1>${title}</h1><p class="def">${text}</p></div>
    </section>
    <section class="panel survey" aria-label="${title} survey">${surveyBlock(item.url, which === "pre" ? "pre-module" : "post-module", s.open, s.label, which)}</section>`;
}

function render() {
  const h = (location.hash || "").replace("#", "");
  const app = document.getElementById("app");
  const m = SETTINGS.modules.find(x => x.id === h);
  if (m) { app.innerHTML = moduleView(m); document.title = m.name + " | The Practice Room"; }
  else if (h === "pre" || h === "post") { app.innerHTML = bookendView(h); document.title = (h === "pre" ? "Before week 1" : "After week 5") + " | The Practice Room"; }
  else {
    app.innerHTML = home(); bindForm(); document.title = "The Practice Room";
    const rr = document.getElementById("readresearch");
    if (rr) rr.addEventListener("click", () => {
      const d = document.getElementById("research");
      d.open = true;
      d.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  renderChip();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
